<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="香港即時生活資訊：天氣預報、交通情況及城巴、九巴、港鐵即時運輸資料。">
    <title>香港生活資訊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip-link" href="#main">跳至主要內容</a>

    <div class="app">
        <header class="app-header">
            <div class="app-header__brand">
                <span class="app-header__mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M9 17h.01M15 17h.01"/>
                    </svg>
                </span>
                <div>
                    <h1>香港生活資訊</h1>
                    <p class="app-header__sub">天氣 · 交通 · 即時運輸</p>
                </div>
            </div>
            <button id="refresh-btn" class="btn-refresh" type="button" aria-label="重新整理所有資料">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>
                </svg>
                <span>重新整理</span>
            </button>
        </header>

        <main id="main" class="bento">
            <!-- 天氣 -->
            <section class="card card--weather" id="weather" aria-labelledby="weather-title">
                <div class="card__head">
                    <h2 id="weather-title">天氣預報</h2>
                    <span class="card__badge" id="weather-loc">香港</span>
                </div>
                <div id="current-weather" class="current-weather" aria-live="polite">
                    <div class="skeleton skeleton--current" role="status"><span class="visually-hidden">載入中…</span></div>
                </div>
                <div class="forecast">
                    <h3 class="forecast__title">未來 7 天預報</h3>
                    <div id="forecast-list" class="forecast__list" aria-live="polite" aria-busy="true"></div>
                </div>
            </section>

            <!-- 交通 -->
            <section class="card card--traffic" id="traffic" aria-labelledby="traffic-title">
                <div class="card__head">
                    <h2 id="traffic-title">交通情況</h2>
                </div>
                <div id="traffic-map" class="traffic" aria-live="polite" aria-busy="true">
                    <div class="skeleton skeleton--block" role="status"><span class="visually-hidden">載入中…</span></div>
                </div>
            </section>

            <!-- 運輸：城巴 / 九巴 / 港鐵 -->
            <section class="card card--transport" id="transport" aria-labelledby="transport-title">
                <div class="card__head">
                    <h2 id="transport-title">即時運輸資料</h2>
                </div>
                <div class="transport-grid">
                    <div class="transport-col" id="citybus" data-line="citybus" aria-label="城巴" aria-live="polite" aria-busy="true"></div>
                    <div class="transport-col" id="kmb" data-line="kmb" aria-label="九巴" aria-live="polite" aria-busy="true"></div>
                    <div class="transport-col" id="mtr" data-line="mtr" aria-label="港鐵" aria-live="polite" aria-busy="true"></div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>資料來源：OpenWeatherMap · DATA.GOV.HK</p>
            <p>香港生活資訊 &copy; 2026</p>
        </footer>
    </div>

    <!-- 運輸詳細查詢：路線 / 站點 / 抵達時間 -->
    <div class="modal" id="route-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal__backdrop" data-close></div>
        <div class="modal__panel" role="document">
            <header class="modal__head">
                <div class="modal__titlewrap">
                    <span class="modal__operator" id="modal-operator">城巴</span>
                    <h2 id="modal-title">路線查詢</h2>
                </div>
                <button class="modal__close" type="button" aria-label="關閉" data-close>
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </header>

            <div class="modal__toolbar">
                <label class="sr-only" for="route-search">搜尋路線</label>
                <input id="route-search" class="modal__search" type="search" inputmode="latin" autocomplete="off" placeholder="輸入路線編號，例如 1A / 720">
                <div class="modal__dir" role="group" aria-label="方向">
                    <button type="button" class="dir-btn is-active" data-dir="outbound">去程</button>
                    <button type="button" class="dir-btn" data-dir="inbound">回程</button>
                </div>
            </div>

            <div class="modal__body">
                <nav class="route-list" id="route-list" aria-label="路線清單"></nav>
                <section class="stop-pane" id="stop-pane" aria-live="polite" hidden>
                    <button class="back-btn" type="button" id="stop-back">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                        返回路線
                    </button>
                    <h3 class="stop-pane__title" id="stop-pane-title"></h3>
                    <div class="stop-list" id="stop-list"></div>
                </section>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
